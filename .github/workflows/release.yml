name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          manifest_version = json.loads(Path("custom_components/rointe/manifest.json").read_text())["version"]
          if manifest_version != tag_version:
              raise SystemExit(f"Tag {tag_version} does not match manifest {manifest_version}")
          PYTHON

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get changelog entry
        id: changelog
        run: |
          # Extract the changelog section for this version
          version="${GITHUB_REF#refs/tags/v}"
          changelog=$(awk -v heading="## v${version} " 'index($0, heading) == 1 {found=1; next} /^## / && found {exit} found {print}' CHANGELOG.md)
          if [ -z "$changelog" ]; then
            changelog="Release ${{ steps.version.outputs.version }}"
          fi
          # Use delimiter for multiline output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          cd custom_components
          zip -r ../rointe.zip rointe/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: rointe.zip
          generate_release_notes: false
