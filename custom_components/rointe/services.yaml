activate_boost:
  name: Activate Boost
  description: Activate boost mode on a Rointe heater for a specified duration.
  target:
    entity:
      integration: rointe
      domain: climate
  fields:
    duration:
      name: Duration
      description: Boost duration in minutes.
      required: true
      default: 60
      selector:
        number:
          min: 5
          max: 240
          step: 5
          unit_of_measurement: minutes
    temperature:
      name: Temperature
      description: Target temperature during boost.
      required: false
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

deactivate_boost:
  name: Deactivate Boost
  description: Deactivate boost mode on a Rointe heater.
  target:
    entity:
      integration: rointe
      domain: climate

set_schedule:
  name: Set Schedule
  description: Set the weekly schedule for a Rointe heater.
  target:
    entity:
      integration: rointe
      domain: climate
  fields:
    schedule:
      name: Schedule
      description: >
        Weekly schedule as a dictionary with day numbers (0-6) as keys 
        and 24-character strings as values. Each character represents an hour:
        'C' = Comfort, 'E' = Eco, 'O' = Off.
      required: true
      example: '{"0": "OOOCCCCCCCEEEECCCCCCOOO", "1": "OOOCCCCCCCEEEECCCCCCOOO"}'
      selector:
        object:

set_holiday_schedule:
  name: Set Holiday Schedule
  description: >
    Replace holiday periods and enable the schedule for the entire Nexa installation.
    Affects every device in the same Rointe installation as the selected heater.
    Times must include a timezone offset. Existing holiday periods are replaced.
  target:
    entity:
      integration: rointe
      domain: climate
  fields:
    periods:
      name: Periods
      description: >
        Ordered list of periods with 'from' and 'to' ISO datetimes including
        offsets. Only the last period may have a null 'to' for indefinite absence.
      required: true
      example: '[{"from": "2026-12-20T08:00:00+01:00", "to": "2026-12-28T18:00:00+01:00"}]'
      selector:
        object:

clear_holiday_schedule:
  name: Clear Holiday Schedule
  description: >
    Remove all holiday periods and disable the schedule for the entire Nexa
    installation. Affects every device in the selected heater's installation.
  target:
    entity:
      integration: rointe
      domain: climate
